services:
  - type: web
    name: pramana-api
    runtime: python
    plan: free
    buildCommand: pip install uv==0.11.25 && uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: pramana-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
