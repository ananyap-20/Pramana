services:
  - type: web
    name: pramana-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PRAMANA_ENABLE_LOCAL_INTAKE
        value: "1"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: pramana-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
