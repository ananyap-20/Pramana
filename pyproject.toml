[project]
name = "pramana-backend"
version = "0.1.0"
description = "Day 1 deterministic evidence-validation demo for Pramana"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<49",
  "fastapi>=0.115,<1.0",
  "pillow==13.0.0",
  "playwright>=1.58,<2",
  "pymongo>=4.19.0",
  "pypdfium2==5.14.0",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "mongomock>=4.3.0",
  "pytest>=8.0,<9.0",
  "reportlab==5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

